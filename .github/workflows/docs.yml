name: Build and Publish C# API Docs

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-docs:
    runs-on: windows-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Micromamba
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: docs
          create-args: >
            -c conda-forge

      - name: Install package only
        shell: pwsh
        run: |
          micromamba install -n docs -c conda-forge --yes gdal-csharp

      - name: Extract sources
        shell: pwsh
        run: |
          $prefix = micromamba env list | Select-String 'docs' | ForEach-Object {
            $_.ToString().Split()[-1]
          }
      
          Expand-Archive `
            "$prefix\share\gdal\csharp-source.zip" `
            src `
            -Force

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install DocFX
        shell: pwsh
        run: |
          dotnet tool update -g docfx
          echo "$env:USERPROFILE\.dotnet\tools" >> $env:GITHUB_PATH

      - name: Inject package version into index.md
        shell: pwsh
        run: |
          $version = micromamba list -n docs libgdal --json | ConvertFrom-Json | Select-Object -ExpandProperty version
      
          (Get-Content index.md -Raw) `
            -replace '\{\{VERSION\}\}', $version |
            Set-Content index.md

      - name: Generate metadata
        shell: pwsh
        run: |
          docfx metadata docfx.json

      - name: Build site
        shell: pwsh
        run: |
          docfx build docfx.json

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
